[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/epochgrid/epochgrid"
homepage = "https://epochgrid.org"

[workspace.dependencies]
anyhow = "1"
async-nats = { version = "0.50", default-features = false, features = ["ring", "nkeys", "kv", "server_2_10"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
nkeys = "0.4.5"
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
openmls_sqlite_storage = "0.3"
openmls_traits = "0.6"
postcard = { version = "1", features = ["alloc"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"

zeroize = { version = "1.9", features = ["serde"] }
