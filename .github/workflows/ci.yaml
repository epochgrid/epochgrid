name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Timeout harness regression tests
        timeout-minutes: 1
        run: ./scripts/dev/verify.sh harness
      - name: Formatting
        timeout-minutes: 2
        run: ./scripts/dev/verify.sh fmt
      - name: Clippy
        timeout-minutes: 11
        run: ./scripts/dev/verify.sh clippy
      - name: Unit tests
        timeout-minutes: 4
        run: ./scripts/dev/verify.sh unit
      - name: Workspace build
        timeout-minutes: 6
        run: ./scripts/dev/verify.sh build
      - name: NATS integration tests
        timeout-minutes: 9
        run: ./scripts/dev/verify.sh nats
      - name: Compose and CLI smoke
        timeout-minutes: 4
        run: ./scripts/dev/verify.sh compose
      - name: Interactive TUI smoke
        timeout-minutes: 4
        run: ./scripts/dev/verify.sh tui
      - name: Dynamic Auth Callout TUI smoke
        timeout-minutes: 4
        run: ./scripts/dev/verify.sh dynamic-tui
      - name: Message relationship TUI smoke
        timeout-minutes: 2
        run: ./scripts/dev/verify.sh relations-tui
      - name: Service participant TUI smoke
        timeout-minutes: 3
        run: ./scripts/dev/verify.sh participants-tui
