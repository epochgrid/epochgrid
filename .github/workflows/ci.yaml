name: CI
# Run the full gate once per PR revision, including the prospective merge commit.
# Plain branch pushes and merges into main do not start another full suite.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  RUST_BACKTRACE: "1"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  EPOCHGRID_TIMING_FILE: target/ci/results.jsonl
  # Hosted runners allow sudo to the distinct nobody UID; local runs use Docker.
  EPOCHGRID_ROLE_NATIVE: "1"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Harness and formatting
        timeout-minutes: 3
        run: |
          ./scripts/dev/verify.sh harness
          ./scripts/dev/verify.sh fmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-1.98.1-
      - name: Clippy
        timeout-minutes: 11
        run: ./scripts/dev/verify.sh clippy
      - name: Build runtime executables once
        timeout-minutes: 16
        run: ./scripts/dev/verify.sh build
      - name: Doctests (source-based Cargo phase)
        timeout-minutes: 4
        run: ./scripts/dev/verify.sh doctest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.sha }}
          path: target/ci/runtime.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain sanitized timing records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-build
          path: target/ci/results.jsonl
          retention-days: 7
          if-no-files-found: ignore
  tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, secrets, nats-0, nats-1, nats-2, nats-3, smoke]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/runtime
      - name: Execute suite without compilation
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            nats-*) ./scripts/dev/verify.sh nats "${SUITE#nats-}" ;;
            smoke)
              python3 scripts/dev/run-bounded.py 120 ./scripts/dev/download-nats.sh
              for phase in compose tui dynamic-join relations-tui participants-tui; do
                ./scripts/dev/verify.sh "$phase"
              done
              echo 'SKIP TD-002: full dynamic TUI messaging smoke remains opt-in'
              ;;
            *) ./scripts/dev/verify.sh "$SUITE" ;;
          esac
      - name: Retain sanitized timing records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-tests-${{ matrix.suite }}
          path: target/ci/results.jsonl
          retention-days: 7
          if-no-files-found: ignore
  byo-nats:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case: [configuration_standalone, configuration_cluster, operator_jwt_standalone, operator_jwt_cluster]
    steps:
      - name: Require successful build
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/runtime
      - name: Qualify operator-owned NATS
        timeout-minutes: 8
        run: ./scripts/dev/verify.sh byo-nats "${{ matrix.case }}"
      - name: Retain sanitized timing records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-byo-${{ matrix.case }}
          path: target/ci/results.jsonl
          retention-days: 7
          if-no-files-found: ignore
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build and package Linux candidate
        timeout-minutes: 22
        run: |
          python3 scripts/dev/run-bounded.py 1200 python3 scripts/release/build-linux.py
          python3 scripts/release/artifact.py package --work target/release-candidate/work --output target/linux-candidate
          python3 scripts/release/artifact.py verify --archive target/linux-candidate/*.tar.gz --checksums target/linux-candidate/SHA256SUMS --output 'target/extracted candidate' --require-candidate --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-candidate-${{ github.sha }}
          path: target/linux-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  linux-qualify:
    needs: [build, linux-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, configuration_standalone, configuration_cluster, operator_jwt_standalone, operator_jwt_cluster]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-candidate-${{ github.sha }}
          path: target/linux-candidate
      - name: Verify and qualify extracted candidate
        timeout-minutes: 15
        env:
          ARTIFACT_SUITE: ${{ matrix.suite }}
        run: |
          python3 scripts/release/artifact.py verify --archive target/linux-candidate/*.tar.gz --checksums target/linux-candidate/SHA256SUMS --output 'target/extracted candidate' --require-candidate --commit "$GITHUB_SHA" > target/artifact-verification.json
          python3 scripts/dev/run-bounded.py 120 ./scripts/dev/download-nats.sh
          python3 scripts/dev/run-bounded.py 180 docker build --target runtime -f scripts/release/qualification.Dockerfile -t epochgrid-artifact-tests:local .
          python3 scripts/dev/run-bounded.py 700 python3 scripts/release/qualify.py --bundle 'target/extracted candidate' --suite "$ARTIFACT_SUITE" --result "target/qualification-$ARTIFACT_SUITE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-qualification-${{ matrix.suite }}-${{ github.sha }}
          path: |
            target/artifact-verification.json
            target/qualification-*.json
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: [build, tests, byo-nats, linux-build, linux-qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          assert results and all(job['result'] == 'success' for job in results.values())
          PYTHON
