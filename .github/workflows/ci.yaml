name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: ./scripts/dev/download-nats.sh
      - name: NATS discovery, MLS invitations, encrypted messaging and restart
        run: NATS_SERVER="$PWD/.dev/nats-image/nats-server" cargo test --locked -p epochgrid-service --test registration -- --ignored
      - name: Compose and host CLI smoke test
        run: ./scripts/dev/smoke.sh
