name: Pinned release verification tools
description: Install the pinned verifier and hash-locked SPDX validator for Ubuntu 24.04
inputs:
  scanner:
    description: Also install Grype for read-only inventory scanning
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INSTALL_SCANNER: ${{ inputs.scanner }}
      run: |
        tools=(gh)
        if test "$INSTALL_SCANNER" = true; then tools+=(grype); fi
        python3 scripts/release/install-tools.py --output target/release-tools "${tools[@]}"
        sudo apt-get update
        sudo apt-get install -y python3-venv
        python3 -m venv target/release-python
        target/release-python/bin/python -m pip install --only-binary=:all: --require-hashes -r scripts/release/requirements.txt
        echo "$PWD/target/release-tools" >> "$GITHUB_PATH"
        echo "$PWD/target/release-python/bin" >> "$GITHUB_PATH"
