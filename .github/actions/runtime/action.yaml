name: Restore runtime
description: Restore and validate this revision's executables on the pinned Ubuntu image
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: runtime-${{ github.sha }}
        path: target/ci
    - shell: bash
      run: |
        tar -xzf target/ci/runtime.tar.gz
        python3 scripts/ci/runtime.py check
    - name: Install isolated keyring dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring libsecret-tools libglib2.0-bin
