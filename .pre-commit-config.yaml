# CI-friendly git hooks configuration for this Rust workspace
# Install: pre-commit install; or use gh cli: gh pr review --fill-form

repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: check cargo formatting
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
        
      - id: clippy-lint
        name: check cargo clippy warnings
        entry: ./scripts/dev/verify.sh clippy 2>/dev/null || echo "skipped"
        language: system
        pass_filenames: false
        always_run: true
    
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: check markdown/formatting in docs
        types_or: [text, javascript, markdown, yaml]
        args: ['--ignore-path', '.gitignore']

ci:
  autoupdate_commit_msg: 'chore: update pre-commit hooks to latest versions'
